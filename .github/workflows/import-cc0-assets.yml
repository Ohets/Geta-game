name: Import local 3D GLB assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download GLB assets
        shell: bash
        run: |
          set -e
          mkdir -p assets/imported assets/environment
          download() { curl -L --fail --retry 3 --retry-delay 2 "$1" -o "$2"; }
          download "https://raw.githubusercontent.com/amvlab/aircraft-models/91d835e8e851b2317fe79af291c9fed6153fd525/models/A380_nologo.glb" "assets/imported/A380_nologo.glb"
          download "https://raw.githubusercontent.com/amvlab/aircraft-models/91d835e8e851b2317fe79af291c9fed6153fd525/models/B787_nologo.glb" "assets/imported/B787_nologo.glb"
          download "https://raw.githubusercontent.com/amvlab/aircraft-models/91d835e8e851b2317fe79af291c9fed6153fd525/models/EVTOL_nologo.glb" "assets/imported/EVTOL_nologo.glb"
          download "https://raw.githubusercontent.com/amvlab/aircraft-models/91d835e8e851b2317fe79af291c9fed6153fd525/models/drone_nologo.glb" "assets/imported/drone_nologo.glb"
          base="https://raw.githubusercontent.com/ToxSam/cc0-models-Polygonal-Mind/main/projects/transit"
          download "$base/Building_01_Art.glb" "assets/environment/Building_01.glb"
          download "$base/Building_02_Art.glb" "assets/environment/Building_02.glb"
          download "$base/Building_03_Art.glb" "assets/environment/Building_03.glb"
          download "$base/Building_04_Art.glb" "assets/environment/Building_04.glb"
          download "$base/Building_05_Art.glb" "assets/environment/Building_05.glb"
          download "$base/Building_06_Art.glb" "assets/environment/Building_06.glb"
          download "$base/Building_07_Art.glb" "assets/environment/Building_07.glb"
          download "$base/Building_08_Art.glb" "assets/environment/Building_08.glb"
          download "$base/Building_09_Art.glb" "assets/environment/Building_09.glb"
          download "$base/Car_01_Art.glb" "assets/environment/Car_01.glb"
          download "$base/Car_02_Art.glb" "assets/environment/Car_02.glb"
          download "$base/Container_01_Art.glb" "assets/environment/Container_01.glb"
          download "$base/Crate_01_Art.glb" "assets/environment/Crate_01.glb"

      - name: Commit imported models
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/imported assets/environment
          if git diff --cached --quiet; then
            echo "No new assets."
            exit 0
          fi
          git commit -m "Add local 3D GLB assets"
          git push
