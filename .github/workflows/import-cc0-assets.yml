name: Import CC0 GLB assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CC0 GLB assets
        shell: bash
        run: |
          set -e
          mkdir -p assets/environment
          base="https://raw.githubusercontent.com/ToxSam/cc0-models-Polygonal-Mind/main/projects/MomusPark"
          curl -L --fail --retry 3 "$base/Tree_01_Art.glb" -o assets/environment/Tree_01.glb
          curl -L --fail --retry 3 "$base/Tree_02_Art.glb" -o assets/environment/Tree_02.glb
          curl -L --fail --retry 3 "$base/Tree_03_Art.glb" -o assets/environment/Tree_03.glb
          curl -L --fail --retry 3 "$base/Tree_04_Art.glb" -o assets/environment/Tree_04.glb
          curl -L --fail --retry 3 "$base/Bush_01_Art.glb" -o assets/environment/Bush_01.glb
          curl -L --fail --retry 3 "$base/Bush_02_Art.glb" -o assets/environment/Bush_02.glb
          curl -L --fail --retry 3 "$base/Rock_01_Art.glb" -o assets/environment/Rock_01.glb
          curl -L --fail --retry 3 "$base/Rock_02_Art.glb" -o assets/environment/Rock_02.glb
          curl -L --fail --retry 3 "$base/Bench_01_Art.glb" -o assets/environment/Bench_01.glb
          curl -L --fail --retry 3 "$base/Fence_01_Art.glb" -o assets/environment/Fence_01.glb

      - name: Commit imported models
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/environment
          if git diff --cached --quiet; then
            echo "No new assets."
            exit 0
          fi
          git commit -m "Add local CC0 3D environment models"
          git push
