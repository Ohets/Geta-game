=0;i<n;i++)d[i]=(Math.random()*2-1)*.55;rainSource=audio.createBufferSource();rainSource.buffer=buf;rainSource.loop=true;let f=audio.createBiquadFilter();f.type='lowpass';f.frequency.value=1100;rainGain=audio.createGain();rainGain.gain.value=.045;rainSource.connect(f);f.connect(rainGain);rainGain.connect(gain);rainSource.start()}catch(e){}}function sound(x){if(x==='gun')snd(150,.07,'sawtooth',.12,55);if(x==='enemy')snd(110,.08,'square',.07,55);if(x==='hit')snd(420,.08,'square',.08,170);if(x==='jump')snd(250,.12,'triangle',.05,500);if(x==='pickup')snd(600,.12,'sine',.07,950);if(x==='empty')snd(80,.05,'square',.04,60);if(x==='explosion'){snd(70,.3,'sawtooth',.16,30);setTimeout(()=>snd(40,.2,'triangle',.1,25),80)}if(x==='vehicle')snd(65,.2,'sawtooth',.06,110);if(x==='step')snd(95,.055,'triangle',.045,48)}function missionComplete(){if(paused||mission<4)return;paused=true;let o=document.createElement('div');o.className='islandResult';o.innerHTML='<div class="islandResultBox"><h2>🏆 Level '+level+' geschafft!</h2><p>Du hast das feindliche Lager erreicht.</p>'+(level<3?'<button id="isNext">➡️ Level '+(level+1)+'</button>':'')+'<button id="isRetry">🔄 Nochmal spielen</button></div>';box.appendChild(o);if(level<3)o.querySelector('#isNext').onclick=()=>{cancelAnimationFrame(raf);try{if(audio)audio.close()}catch(_){}box.innerHTML='';islandShooter(level+1)};o.querySelector('#isRetry').onclick=()=>{cancelAnimationFrame(raf);try{if(audio)audio.close()}catch(_){}box.innerHTML='';islandShooter(level)}}function hud(){let h=box.querySelector('#isHud');if(h)h.innerHTML='❤️ '+Math.round(health)+'% &nbsp; 🔫 '+ammo+'/'+weapons[weapon][1]+' &nbsp; ⭐ '+score+'<br>🎯 '+(mission<3?'Schalte 3 Gegner aus ('+mission+'/3)':'Erreiche das feindliche Lager')+' &nbsp; 💣 '+grenades+' &nbsp; 🏃 '+Math.round(stamina)+'% &nbsp; '+weapons[weapon][0]}function tree(x,z){let g=new THREE.Group(),t=new THREE.Mesh(new THREE.CylinderGeometry(.3,.5,3,7),mat(0x654321)),c=new THREE.Mesh(new THREE.ConeGeometry(2,5,8),m
