<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GETA Games</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>🎮 GETA GAMES</h1><p>Spannende Mini-Games – direkt im Browser.</p></header>
<main><div class="games">
<article><h2>⚡ Reaction Rush</h2><p>Warte auf Grün und tippe so schnell wie möglich.</p><button onclick="reaction()">Start</button><div id="reactionResult"></div></article>
<article><h2>🚀 Space Dodger</h2><p>Bewege dein Schiff und überlebe so lange wie möglich.</p><div class="gamebox" id="spaceBox"><button onclick="space()">Start</button></div></article>
<article><h2>🧠 Memory Match</h2><p>Finde alle gleichen Paare.</p><div id="memoryResult"></div><button onclick="memory()">Start</button></article>
<article><h2>🎯 Aim Challenge</h2><p>Triff 10 Ziele möglichst schnell.</p><div class="gamebox" id="aimBox"><button onclick="aim()">Start</button></div></article>
</div></main><script src="script.js"></script></body></html>
